{% extends "base.html" %}
{% block content %}
    <h1>My Profile</h1>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" value="{{ member.name }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ member.email }}" required>

        <button type="submit">Update Profile</button>
    </form>
{% endblock %}
